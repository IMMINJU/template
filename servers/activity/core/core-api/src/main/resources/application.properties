spring.application.name=activity
# 모듈 설정: clients 모듈마다 자기 yml (주소 · timeout)
spring.config.import=classpath:client-example.yml
# 개발은 이 맥에서만(HOST, 컨테이너 등 밖에 열 때 0.0.0.0, 인증 · TLS 먼저).
# notes(8000) · tags(8002 · 9002)와 같이 띄울 수 있게 기본 8001 · 9001
server.address=${HOST:127.0.0.1}
server.port=${PORT:8001}
spring.grpc.server.address=${HOST:127.0.0.1}
spring.grpc.server.port=${GRPC_PORT:9001}
# Postgres (docker/docker-compose.middleware.yaml, pnpm infra). 연결은 PG* 환경 변수. 테스트는 activity_test
spring.datasource.url=jdbc:postgresql://${PGHOST:127.0.0.1}:${PGPORT:5432}/${PGDATABASE:activity}
spring.datasource.username=${PGUSER:app}
spring.datasource.password=${PGPASSWORD:app}
